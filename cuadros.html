<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Arte Melquiades Ramos - Catálogo de Obras</title>
    <style>
        :root {
            --bg-color: #f6f1eb;
            --card-bg: #e8ded2;
            --primary-red: #c02b27;
            --text-dark: #1a1a1a;
            --text-muted: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.5;
        }

        /* ENCABEZADO */
        header {
            background-color: #ffffff;
            border-bottom: 2px solid var(--primary-red);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #000000;
            text-decoration: none;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 1.75rem;
        }

        nav a {
            text-decoration: none;
            color: #1a1a1a;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--primary-red);
        }

        nav a.active-link {
            background-color: var(--primary-red);
            color: #ffffff;
            padding: 0.5rem 1.4rem;
            border-radius: 9999px;
        }

        /* CONTENEDOR PRINCIPAL VERTICAL */
        main {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            width: 100% !important;
            max-width: 1400px !important;
            margin: 0 auto !important;
            padding: 2.5rem 1.5rem 5rem !important;
            box-sizing: border-box !important;
        }

        .titulo-seccion {
            width: 100% !important;
            text-align: center !important;
            margin-bottom: 1.5rem !important;
        }

        .titulo-seccion h1 {
            font-size: 2.3rem;
            font-weight: 800;
            color: var(--primary-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
        }

        .titulo-seccion p {
            font-size: 1.05rem;
            color: var(--text-muted);
        }

        /* BOTÓN CENTRADO ARRIBA */
        .contenedor-filtros-botones {
            width: 100% !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin: 0 auto 2.5rem auto !important;
        }

        .btn-filtro {
            background-color: var(--primary-red);
            color: #ffffff;
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 9999px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* CUADRÍCULA DINÁMICA DE FIREBASE */
        .grid-cuadros {
            width: 100% !important;
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)) !important;
            gap: 1.75rem !important;
            justify-content: center !important;
        }

        /* TARJETA GENERADA */
        .card-obra {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.06);
        }

        .card-obra img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            background-color: #dfd5c9;
            cursor: pointer;
        }

        .card-info {
            padding: 1.3rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .obra-titulo {
            font-size: 1.25rem;
            font-weight: 800;
            color: #111111;
            margin-bottom: 0.6rem;
        }

        .obra-detalle {
            font-size: 0.9rem;
            color: #3b3b3b;
            line-height: 1.45;
            margin-bottom: 0.2rem;
        }

        .obra-detalle strong {
            color: #1a1a1a;
        }

        .obra-precio {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--primary-red);
            margin: 1.2rem 0 1rem;
        }

        .btn-comprar {
            margin-top: auto;
            background-color: var(--primary-red);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 5px;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        /* PAGINACIÓN ABAJO CENTRADA */
        .contenedor-paginacion {
            width: 100% !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-top: 3rem !important;
            gap: 0.5rem;
        }

        .contenedor-paginacion button {
            padding: 0.45rem 0.9rem;
            border: 1px solid #dcd0c2;
            background-color: #ffffff;
            color: #333333;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        .contenedor-paginacion button.activo {
            background-color: var(--primary-red);
            color: #ffffff;
            border-color: var(--primary-red);
        }

        /* MODAL VISOR */
        .modal-visor {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .btn-cerrar-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-contenido img {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 4px;
        }

        .modal-titulo {
            color: #ffffff;
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 1rem 1.5rem;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }
        }
    </style>
</head>

<body>

    <!-- ENCABEZADO ACTUALIZADO -->
    <header>
        <a href="index.html" class="logo">GALERÍA DE ARTE MELQUIADES RAMOS</a>
        <nav>
            <ul>
                <li><a href="index.html">INICIO</a></li>
                <li><a href="galeria3d.html">GALERÍA 3D</a></li>
                <li><a href="cuadros.html" class="active-link">CUADROS</a></li>
                <li><a href="contacto.html">CONTACTO</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="titulo-seccion">
            <h1 id="titulo-catalogo">CATÁLOGO DE OBRAS</h1>
            <p>Colección de obras originales de Melquiades Ramos.</p>
        </div>

        <!-- SOLO EL BOTÓN CENTRAL -->
        <div class="contenedor-filtros-botones">
            <button class="btn-filtro activo" onclick="filtrarPorPrecio('todos', this)">TODAS LAS OBRAS</button>
        </div>

        <!-- CONTENEDOR DONDE FIREBASE INYECTA LOS CUADROS -->
        <div class="grid-cuadros" id="grid-cuadros">
            <p style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #666; font-weight: bold;">Cargando
                catálogo en directo...</p>
        </div>

        <!-- PAGINACIÓN DINÁMICA -->
        <div class="contenedor-paginacion" id="paginacion"></div>
    </main>

    <!-- MODAL DE AMPLIACIÓN -->
    <div id="modalVisor" class="modal-visor" onclick="cerrarVisorModal()">
        <span class="btn-cerrar-modal" onclick="cerrarVisorModal()">&times;</span>
        <div class="modal-contenido" onclick="event.stopPropagation()">
            <img id="imgModal" src="" alt="Obra Ampliada">
            <div id="tituloModal" class="modal-titulo"></div>
        </div>
    </div>

    <!-- SDK DE FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCojaFTEL_LHiCwfyeFtSesYNsDiiy3f2A",
            authDomain: "galeriasramos-cc818.firebaseapp.com",
            projectId: "galeriasramos-cc818",
            storageBucket: "galeriasramos-cc818.firebasestorage.app",
            messagingSenderId: "365138640156",
            appId: "1:365138640156:web:959c1690ee4ea759b4ced9"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let todasLasObras = [];
        let obrasFiltradas = [];
        let paginaActual = 1;
        const obrasPorPagina = 8;

        async function cargarCatalogo() {
            const grid = document.getElementById("grid-cuadros");
            try {
                const snapshot = await db.collection("obras").get();
                if (snapshot.empty) {
                    grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>No se encontraron obras disponibles.</p>";
                    return;
                }

                todasLasObras = [];
                snapshot.forEach(doc => {
                    todasLasObras.push({ id: doc.id, ...doc.data() });
                });

                // Ordenar por ID del documento (Obra_1, Obra_2, etc.)
                todasLasObras.sort((a, b) => {
                    const numA = parseInt(a.id.replace(/\D/g, '')) || 0;
                    const numB = parseInt(b.id.replace(/\D/g, '')) || 0;
                    return numA - numB;
                });

                obrasFiltradas = [...todasLasObras];
                renderizarCatalogo();
            } catch (error) {
                console.error("Error al cargar obras:", error);
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: red;'>Hubo un problema al cargar el catálogo.</p>";
            }
        }

        function renderizarCatalogo() {
            const grid = document.getElementById("grid-cuadros");
            grid.innerHTML = "";

            const inicio = (paginaActual - 1) * obrasPorPagina;
            const fin = inicio + obrasPorPagina;
            const obrasPagina = obrasFiltradas.slice(inicio, fin);

            if (obrasPagina.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>No hay obras para mostrar.</p>";
                document.getElementById("paginacion").innerHTML = "";
                return;
            }

            obrasPagina.forEach((obra, index) => {
                const card = document.createElement("article");
                card.className = "card-obra";

                // Mapeo exacto de los campos de Firestore
                const numDoc = parseInt(obra.id.replace(/\D/g, '')) || (index + 1);
                // Si obra.foto viene como "foto1.jpeg" pero en tu carpeta local son "obra mera (X).jpeg":
                const imagenSrc = obra.foto || `obra mera (${numDoc}).jpeg`;
                const titulo = obra.obraNum ? obra.obraNum.trim() : `Obra #${numDoc}`;
                const tecnica = obra.tecnica || "Técnica mixta sobre tela";
                const medidas = obra.medidas || "-";
                const precio = obra.precio || "-";

                card.innerHTML = `
                    <img src="${imagenSrc}" alt="${titulo}" onerror="this.onerror=null; this.src='obra mera (${numDoc}).jpeg';" onclick="abrirVisorModal(this.src, '${titulo}')">
                    <div class="card-info">
                        <h2 class="obra-titulo">${titulo}</h2>
                        <p class="obra-detalle"><strong>Técnica:</strong> ${tecnica}</p>
                        <p class="obra-detalle"><strong>Medidas:</strong> ${medidas}</p>
                        <p class="obra-precio">${precio}</p>
                        <a href="contacto.html" class="btn-comprar">ME INTERESA / COMPRAR</a>
                    </div>
                `;
                grid.appendChild(card);
            });

            generarPaginacion();
        }

        function generarPaginacion() {
            const paginacionDiv = document.getElementById("paginacion");
            paginacionDiv.innerHTML = "";

            const totalPaginas = Math.ceil(obrasFiltradas.length / obrasPorPagina);
            if (totalPaginas <= 1) return;

            for (let i = 1; i <= totalPaginas; i++) {
                const btn = document.createElement("button");
                btn.innerText = i;
                if (i === paginaActual) {
                    btn.className = "activo";
                }
                btn.onclick = () => {
                    paginaActual = i;
                    renderizarCatalogo();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                paginacionDiv.appendChild(btn);
            }
        }

        function filtrarPorPrecio(criterio, boton) {
            document.querySelectorAll(".btn-filtro").forEach(b => b.classList.remove("activo"));
            if (boton) boton.classList.add("activo");

            if (criterio === "todos") {
                obrasFiltradas = [...todasLasObras];
            } else {
                obrasFiltradas = todasLasObras.filter(obra => {
                    const precioNum = parseInt((obra.precio || '').replace(/\D/g, ''));
                    return precioNum === Number(criterio);
                });
            }
            paginaActual = 1;
            renderizarCatalogo();
        }

        function abrirVisorModal(src, titulo) {
            const modal = document.getElementById("modalVisor");
            document.getElementById("imgModal").src = src;
            document.getElementById("tituloModal").innerText = titulo;
            modal.style.display = "flex";
        }

        function cerrarVisorModal() {
            document.getElementById("modalVisor").style.display = "none";
        }

        window.onload = cargarCatalogo;
    </script>
</body>

</html>
