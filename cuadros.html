<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Obras | Galerías Ramos</title>
    <style>
        :root {
            --color-primario: #1a1a1a;
            --color-secundario: #4a4a4a;
            --color-fondo: #f9f9f9;
            --color-blanco: #ffffff;
            --color-borde: #e0e0e0;
            --color-destacado: #2c3e50;
            --fuente-principal: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--fuente-principal);
            background-color: var(--color-fondo);
            color: var(--color-primario);
            line-height: 1.6;
        }

        header {
            background-color: var(--color-blanco);
            border-bottom: 1px solid var(--color-borde);
            padding: 1.5rem 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav {
            margin-top: 1rem;
        }

        nav a {
            color: var(--color-secundario);
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
        }

        nav a:hover {
            color: var(--color-primario);
        }

        .contenedor {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .filtros-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .btn-filtro {
            background-color: var(--color-blanco);
            border: 1px solid var(--color-borde);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-filtro:hover, .btn-filtro.activo {
            background-color: var(--color-destacado);
            color: var(--color-blanco);
            border-color: var(--color-destacado);
        }

        .grid-cuadros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        .card-cuadro {
            background: var(--color-blanco);
            border: 1px solid var(--color-borde);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card-cuadro:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }

        .contenedor-img {
            width: 100%;
            height: 220px;
            background-color: #eee;
            cursor: pointer;
            overflow: hidden;
        }

        .contenedor-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .contenedor-img:hover img {
            transform: scale(1.03);
        }

        .info-cuadro {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .info-cuadro h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .info-cuadro p {
            font-size: 0.9rem;
            color: var(--color-secundario);
            margin-bottom: 0.3rem;
        }

        .precio-cuadro {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--color-destacado);
            margin: 0.8rem 0;
        }

        .btn-comprar {
            margin-top: auto;
            width: 100%;
            padding: 10px;
            background-color: var(--color-primario);
            color: var(--color-blanco);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-comprar:hover {
            background-color: #333;
        }

        .btn-comprar:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .paginacion {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 3rem;
        }

        .btn-pag {
            padding: 8px 12px;
            border: 1px solid var(--color-borde);
            background-color: var(--color-blanco);
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-pag.activa {
            background-color: var(--color-destacado);
            color: var(--color-blanco);
            border-color: var(--color-destacado);
        }

        .btn-pag:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Visor Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-contenido {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 4px;
        }

        .modal-titulo {
            color: #fff;
            margin-top: 15px;
            font-size: 1.1rem;
        }

        .cerrar-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Galerías Ramos</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="cuadros.html">Catálogo</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <div class="contenedor">
        <div class="filtros-container">
            <button class="btn-filtro activo" onclick="filtrarPorPrecio('todos', this)">Todas las obras</button>
            <button class="btn-filtro" onclick="filtrarPorPrecio('1000', this)">1000 €</button>
            <button class="btn-filtro" onclick="filtrarPorPrecio('2000', this)">2000 €</button>
            <button class="btn-filtro" onclick="filtrarPorPrecio('3000', this)">3000 €</button>
        </div>

        <div id="grid-cuadros" class="grid-cuadros">
            <!-- Los cuadros se generan dinámicamente -->
        </div>

        <div id="paginacion" class="paginacion">
            <!-- La paginación se genera dinámicamente -->
        </div>
    </div>

    <!-- Visor Modal para ampliar imagen -->
    <div id="modalVisor" class="modal" onclick="cerrarVisorModal()">
        <span class="cerrar-modal">&times;</span>
        <img id="imgModal" class="modal-contenido" src="" alt="Ampliación de obra">
        <div id="tituloModal" class="modal-titulo"></div>
    </div>

    <script>
        let obrasGlobales = [];
        let obrasFiltradas = [];
        let paginaActual = 1;
        const obrasPorPagina = 12;

        function cargarCatalogo() {
            // BORRAMOS CUALQUIER MEMORIA PREVIA PARA PREVENIR ERRORES
            localStorage.clear();

            let obras = [];

            // Listas exactas de precios asignadas por id de obra
            const a3000 = [19, 43, 86];
            const a2000 = [1, 4, 5, 18, 21, 23, 26, 28, 34, 57, 84, 85];

            for (let i = 1; i <= 88; i++) {
                const es35 = (i === 35);
                let precioReal = "1000 €";

                if (es35) {
                    precioReal = "-";
                } else if (a3000.includes(i)) {
                    precioReal = "3000 €";
                } else if (a2000.includes(i)) {
                    precioReal = "2000 €";
                }

                obras.push({
                    id: i,
                    titulo: `Obra N.º ${i}`,
                    tecnica: "mixta sobre tela",
                    medidas: "a consultar",
                    precio: precioReal,
                    estado: es35 ? "NO DISPONIBLE" : "DISPONIBLE",
                    imagen: `obra mera (${i}).jpeg`
                });
            }

            obrasGlobales = obras;
            obrasFiltradas = [...obrasGlobales];
            renderizarPagina(1);
        }

        function renderizarPagina(numPagina) {
            paginaActual = numPagina;
            const grid = document.getElementById('grid-cuadros');
            grid.innerHTML = '';

            const inicio = (paginaActual - 1) * obrasPorPagina;
            const fin = inicio + obrasPorPagina;
            const obrasPagina = obrasFiltradas.slice(inicio, fin);

            if (obrasPagina.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #666; font-weight: bold;">No hay obras para mostrar.</p>`;
                document.getElementById('paginacion').innerHTML = '';
                return;
            }

            obrasPagina.forEach(obra => {
                const card = document.createElement('div');
                card.className = 'card-cuadro';

                const esNoDisponible = (obra.estado === 'NO DISPONIBLE');
                const textoBtn = esNoDisponible ? 'NO DISPONIBLE' : 'ME INTERESA / COMPRAR';

                card.innerHTML = `
                    <div class="contenedor-img" onclick="abrirVisorModal('${obra.imagen}', '${obra.titulo}')">
                        <img src="${obra.imagen}" alt="${obra.titulo}" onerror="this.src='https://via.placeholder.com/300x220?text=Obra+Galeria'">
                    </div>
                    <div class="info-cuadro">
                        <h3>${obra.titulo}</h3>
                        <p><strong>Técnica:</strong> ${obra.tecnica}</p>
                        <p><strong>Medidas:</strong> ${obra.medidas}</p>
                        <div class="precio-cuadro">${obra.precio}</div>
                        <button class="btn-comprar" ${esNoDisponible ? 'disabled' : ''} onclick="contactarObra('${obra.titulo}')">${textoBtn}</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderizarPaginacion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderizarPaginacion() {
            const contenedorPag = document.getElementById('paginacion');
            contenedorPag.innerHTML = '';

            const totalPaginas = Math.ceil(obrasFiltradas.length / obrasPorPagina);
            if (totalPaginas <= 1) return;

            const btnAnt = document.createElement('button');
            btnAnt.className = 'btn-pag';
            btnAnt.innerText = '« Anterior';
            btnAnt.disabled = (paginaActual === 1);
            btnAnt.onclick = () => renderizarPagina(paginaActual - 1);
            contenedorPag.appendChild(btnAnt);

            for (let i = 1; i <= totalPaginas; i++) {
                const btnNum = document.createElement('button');
                btnNum.className = `btn-pag ${i === paginaActual ? 'activa' : ''}`;
                btnNum.innerText = i;
                btnNum.onclick = () => renderizarPagina(i);
                contenedorPag.appendChild(btnNum);
            }

            const btnSig = document.createElement('button');
            btnSig.className = 'btn-pag';
            btnSig.innerText = 'Siguiente »';
            btnSig.disabled = (paginaActual === totalPaginas);
            btnSig.onclick = () => renderizarPagina(paginaActual + 1);
            contenedorPag.appendChild(btnSig);
        }

        function filtrarPorPrecio(precioSeleccionado, boton) {
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
            if (boton) boton.classList.add('activo');

            if (precioSeleccionado === 'todos') {
                obrasFiltradas = [...obrasGlobales];
            } else {
                obrasFiltradas = obrasGlobales.filter(obra => {
                    if (obra.precio === '-') return false;
                    const valorNum = parseInt(obra.precio.replace(/[^0-9]/g, '')) || 0;
                    return valorNum === parseInt(precioSeleccionado);
                });
            }

            renderizarPagina(1);
        }

        function contactarObra(titulo) {
            window.location.href = `contacto.html?obra=${encodeURIComponent(titulo)}`;
        }

        function abrirVisorModal(rutaImagen, titulo) {
            const modal = document.getElementById('modalVisor');
            const img = document.getElementById('imgModal');
            const txtTitulo = document.getElementById('tituloModal');

            img.src = rutaImagen;
            txtTitulo.innerText = titulo;
            modal.style.display = 'flex';
        }

        function cerrarVisorModal() {
            document.getElementById('modalVisor').style.display = 'none';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                cerrarVisorModal();
            }
        });

        document.addEventListener('DOMContentLoaded', cargarCatalogo);
    </script>
</body>
</html>
