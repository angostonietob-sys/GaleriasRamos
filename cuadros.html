<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerías Ramos - Catálogo de Obras</title>
    <style>
        :root {
            --bg-color: #f4eee1;
            --card-bg: #e6dfcc;
            --brand-red: #c82323;
            --text-dark: #1a1a1a;
            --border-color: #d8d0bd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
        }

        header {
            background-color: var(--bg-color);
            border-bottom: 2px solid var(--brand-red);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }

        nav a:hover,
        nav a.active {
            color: var(--brand-red);
        }

        nav a.active-pill {
            background-color: var(--brand-red);
            color: white;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
        }

        main {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .titulo-seccion {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .titulo-seccion h1 {
            font-size: 2.2rem;
            color: var(--brand-red);
            text-transform: uppercase;
        }

        .titulo-seccion p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .contenedor-filtros-botones {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .btn-filtro {
            background-color: var(--card-bg);
            border: 2px solid var(--brand-red);
            color: var(--brand-red);
            padding: 0.5rem 1.2rem;
            border-radius: 25px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-filtro:hover,
        .btn-filtro.activo {
            background-color: var(--brand-red);
            color: white;
        }

        .grid-cuadros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            min-height: 400px;
        }

        .card-cuadro {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card-cuadro:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .contenedor-img {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #d8d0bd;
            cursor: pointer;
        }

        .contenedor-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .contenedor-img:hover img {
            transform: scale(1.05);
        }

        .info-cuadro {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .info-cuadro h3 {
            font-size: 1.1rem;
            margin-bottom: 0.6rem;
            color: var(--text-dark);
        }

        .info-cuadro p {
            font-size: 0.85rem;
            color: #444;
            margin-bottom: 0.3rem;
        }

        .precio-cuadro {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--brand-red);
            margin: 1rem 0;
        }

        .btn-comprar {
            background-color: var(--brand-red);
            color: white;
            border: none;
            padding: 0.7rem;
            width: 100%;
            border-radius: 4px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-top: auto;
            transition: background-color 0.2s;
        }

        .btn-comprar:hover {
            background-color: #a01a1a;
        }

        .btn-comprar:disabled {
            background-color: #888888 !important;
            cursor: not-allowed;
        }

        .contenedor-paginacion {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin: 2.5rem 0 1rem;
            flex-wrap: wrap;
        }

        .btn-pag {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-dark);
            padding: 0.5rem 0.9rem;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-pag:hover,
        .btn-pag.activa {
            background-color: var(--brand-red);
            color: white;
            border-color: var(--brand-red);
        }

        .btn-pag:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .modal-visor {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.88);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .modal-contenido {
            position: relative;
            max-width: 90%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-contenido img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border: 2px solid #ffffff;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            border-radius: 4px;
        }

        .modal-titulo {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 800;
            margin-top: 15px;
            text-align: center;
        }
