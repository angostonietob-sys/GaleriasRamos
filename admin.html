<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Arte Melquiades Ramos - Panel Admin</title>
    <style>
        :root {
            --bg-color: #f4eee1;
            --card-bg: #e6dfcc;
            --brand-red: #c82323;
            --text-dark: #1a1a1a;
            --border-color: #d8d0bd;
            --btn-green: #2e7d32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 2rem;
            min-height: 100vh;
        }

        .contenedor-login {
            max-width: 420px;
            margin: 5rem auto;
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .contenedor-login h2 {
            font-size: 1.4rem;
            color: var(--brand-red);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .contenedor-login p {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--brand-red);
        }

        .acciones-header {
            display: flex;
            gap: 0.7rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-accion {
            padding: 0.55rem 0.95rem;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.82rem;
            transition: opacity 0.2s;
        }

        .btn-accion:hover {
            opacity: 0.9;
        }

        .btn-crear-todo {
            background-color: #f57c00;
            color: white;
        }

        .btn-cambiar-pass {
            background-color: #0288d1;
            color: white;
        }

        .btn-logout {
            background-color: var(--brand-red);
            color: white;
        }

        .contenedor-admin {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 2rem;
        }

        @media (max-width: 850px) {
            .contenedor-admin {
                grid-template-columns: 1fr;
            }
        }

        .card-formulario,
        .card-tabla {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .card-formulario h2,
        .card-tabla h2 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .campo {
            margin-bottom: 1rem;
            text-align: left;
        }

        .campo label {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
            background-color: #fff;
        }

        .btn-guardar {
            background-color: var(--btn-green);
            color: white;
            border: none;
            padding: 0.8rem;
            width: 100%;
            border-radius: 4px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .btn-guardar:hover {
            opacity: 0.9;
        }

        .contenedor-tabla {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 0.7rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        th {
            background-color: #d8d0bd;
            font-weight: 800;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 99;
        }

        .modal-contenido {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            width: 350px;
            border: 1px solid var(--border-color);
        }

        .error-msg {
            color: var(--brand-red);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>

    <!-- PANTALLA LOGIN -->
    <div id="seccion-login" class="contenedor-login">
        <h2>Acceso Administración</h2>
        <p>Galería de Arte Melquiades Ramos — Gestión de Catálogo</p>

        <form id="form-login" onsubmit="iniciarSesion(event)">
            <div class="campo">
                <label>Correo Electrónico:</label>
                <input type="email" id="login-email" value="Melquiadesramos94@gmail.com" required>
            </div>
            <div class="campo">
                <label>Contraseña:</label>
                <input type="password" id="login-pass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-guardar">ENTRAR AL PANEL</button>
            <p id="error-login" class="error-msg">Correo o contraseña incorrectos.</p>
        </form>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="seccion-admin" style="display: none;">
        <header>
            <h1>PANEL DE CONTROL — GALERÍA DE ARTE MELQUIADES RAMOS</h1>
            <div class="acciones-header">
                <button class="btn-accion btn-crear-todo" onclick="inicializar88Obras()">🚀 Subir las 88 obras con los precios actualizados</button>
                <button class="btn-accion btn-cambiar-pass" onclick="abrirModalPass()">Cambiar Contraseña</button>
                <button class="btn-accion btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </header>

        <div class="contenedor-admin">
            <!-- FORMULARIO EDICIÓN -->
            <div class="card-formulario">
                <h2>Editar Obra</h2>
                <form id="form-cuadro" onsubmit="guardarObra(event)">
                    <input type="hidden" id="edit-id" value="">

                    <div class="campo">
                        <label>ID Documento en Firebase:</label>
                        <input type="text" id="input-doc-id" placeholder="obra_1" required>
                    </div>

                    <div class="campo">
                        <label>Título / Número (obraNum):</label>
                        <input type="text" id="input-titulo" placeholder="Obra #1" required>
                    </div>

                    <div class="campo">
                        <label>Técnica:</label>
                        <input type="text" id="input-tecnica" value="Técnica mixta sobre tela" required>
                    </div>

                    <div class="campo">
                        <label>Medidas:</label>
                        <input type="text" id="input-medidas" value="100 x 70 cm" required>
                    </div>

                    <div class="campo">
                        <label>Precio:</label>
                        <input type="text" id="input-precio" placeholder="2000€" required>
                    </div>

                    <div class="campo">
                        <label>Estado:</label>
                        <select id="input-estado">
                            <option value="DISPONIBLE">DISPONIBLE</option>
                            <option value="NO DISPONIBLE">NO DISPONIBLE</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Nombre de Foto (foto):</label>
                        <input type="text" id="input-imagen" placeholder="foto1.jpeg" required>
                    </div>

                    <button type="submit" class="btn-guardar" id="btn-guardar-texto">GUARDAR EN FIREBASE</button>
                </form>
            </div>

            <!-- TABLA DE OBRAS -->
            <div class="card-tabla">
                <h2>Inventario en Firebase (<span id="contador-obras">0</span> / 88)</h2>
                <div class="contenedor-tabla">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Obra</th>
                                <th>Precio</th>
                                <th>Estado</th>
                                <th>Foto</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CAMBIO DE CONTRASEÑA -->
    <div id="modal-pass" class="modal">
        <div class="modal-contenido">
            <h3 style="margin-bottom: 1rem; color: var(--brand-red);">Cambiar Contraseña</h3>
            <form onsubmit="guardarNuevaPass(event)">
                <div class="campo">
                    <label>Nueva Contraseña:</label>
                    <input type="password" id="nueva-pass" required minlength="4" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-guardar" style="margin-bottom: 0.5rem;">GUARDAR NUEVA CONTRASEÑA</button>
                <button type="button" onclick="cerrarModalPass()"
                    style="width:100%; padding:0.6rem; background:#666; color:white; border:none; border-radius:4px; cursor:pointer;">CANCELAR</button>
            </form>
        </div>
    </div>

    <script>
        // Configuración de tu proyecto en Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCojaFTEL_LHiCwfyeFtSesYNsDiiy3f2A",
            authDomain: "galeriasramos-cc818.firebaseapp.com",
            projectId: "galeriasramos-cc818",
            storageBucket: "galeriasramos-cc818.firebasestorage.app",
            messagingSenderId: "365138640156",
            appId: "1:365138640156:web:959c1690ee4ea759b4ced9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let listaObras = [];

        // LÓGICA DE INICIO DE SESIÓN ESTRICTA (Sin comodines)
        function iniciarSesion(e) {
            e.preventDefault();
            const emailInput = document.getElementById('login-email').value.trim().toLowerCase();
            const passInput = document.getElementById('login-pass').value.trim();

            const correoCorrecto = "melquiadesramos94@gmail.com";
            // Si nunca la ha cambiado, la inicial es ramos2026. En cuanto la cambie, SOLO valdrá la suya.
            const passGuardada = localStorage.getItem('admin_pass') || 'ramos2026';

            // Comprobación estricta y única
            if (emailInput === correoCorrecto && passInput === passGuardada) {
                document.getElementById('seccion-login').style.display = 'none';
                document.getElementById('seccion-admin').style.display = 'block';
                document.getElementById('error-login').style.display = 'none';
                escucharObrasFirestore();
            } else {
                document.getElementById('error-login').style.display = 'block';
            }
        }

        function cerrarSesion() {
            document.getElementById('seccion-login').style.display = 'block';
            document.getElementById('seccion-admin').style.display = 'none';
            document.getElementById('login-pass').value = '';
        }

        function abrirModalPass() { document.getElementById('modal-pass').style.display = 'flex'; }
        function cerrarModalPass() { document.getElementById('modal-pass').style.display = 'none'; }

        function guardarNuevaPass(e) {
            e.preventDefault();
            const nueva = document.getElementById('nueva-pass').value.trim();
            if (!nueva) return;

            // Se almacena únicamente en su navegador y sobreescribe cualquier clave previa
            localStorage.setItem('admin_pass', nueva);
            alert('¡Contraseña cambiada con éxito! A partir de ahora solo se puede acceder con la nueva clave.');
            cerrarModalPass();
            document.getElementById('nueva-pass').value = '';
        }

        // SINCRONIZACIÓN EN TIEMPO REAL CON FIRESTORE
        function escucharObrasFirestore() {
            db.collection("obras").onSnapshot((snapshot) => {
                listaObras = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    listaObras.push({
                        docId: doc.id,
                        titulo: data.obraNum || data.titulo || doc.id,
                        tecnica: data.tecnica || 'Técnica mixta sobre tela',
                        medidas: data.medidas || '100 x 70 cm',
                        precio: (data.precio !== undefined && data.precio !== '') ? data.precio : '-',
                        estado: data.estado || 'DISPONIBLE',
                        imagen: data.foto || data.imagen || ''
                    });
                });

                // Ordenar del 1 al 88 numéricamente
                listaObras.sort((a, b) => {
                    const numA = parseInt(a.docId.replace(/\D/g, '')) || 0;
                    const numB = parseInt(b.docId.replace(/\D/g, '')) || 0;
                    return numA - numB;
                });

                document.getElementById('contador-obras').innerText = listaObras.length;
                renderizarTabla(listaObras);
            }, (error) => {
                console.error("Error al leer Firestore:", error);
                alert("Error al cargar obras de Firebase: " + error.message);
            });
        }

        // PINTAR LA TABLA
        function renderizarTabla(obras) {
            const tbody = document.getElementById('tabla-body');
            tbody.innerHTML = '';

            if (obras.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 1.5rem;">No hay obras en Firebase. Pulsa el botón superior para subirlas.</td></tr>';
                return;
            }

            obras.forEach(obra => {
                const tr = document.createElement('tr');
                const esDisponible = obra.estado === 'DISPONIBLE';
                const colorEstado = esDisponible ? '#2e7d32' : '#c82323';

                tr.innerHTML = `
                    <td><strong>${obra.docId}</strong></td>
                    <td>${obra.titulo}</td>
                    <td style="font-weight: 800; color: #2e7d32;">${obra.precio}</td>
                    <td><span style="color: ${colorEstado}; font-weight: 700;">${obra.estado}</span></td>
                    <td><code>${obra.imagen}</code></td>
                    <td>
                        <button onclick="prepararEdicion('${obra.docId}')" style="padding:0.35rem 0.7rem; background:#0288d1; color:white; border:none; border-radius:4px; cursor:pointer; font-weight:700;">Editar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // CARGAR DATOS EN EL FORMULARIO PARA EDITAR
        function prepararEdicion(docId) {
            const obra = listaObras.find(o => o.docId === docId);
            if (obra) {
                document.getElementById('edit-id').value = obra.docId;
                document.getElementById('input-doc-id').value = obra.docId;
                document.getElementById('input-doc-id').disabled = true;
                document.getElementById('input-titulo').value = obra.titulo;
                document.getElementById('input-tecnica').value = obra.tecnica;
                document.getElementById('input-medidas').value = obra.medidas;
                document.getElementById('input-precio').value = obra.precio;
                document.getElementById('input-estado').value = obra.estado;
                document.getElementById('input-imagen').value = obra.imagen;
                document.getElementById('btn-guardar-texto').innerText = "ACTUALIZAR " + obra.docId.toUpperCase();
            }
        }

        // GUARDAR O ACTUALIZAR UNA OBRA
        function guardarObra(e) {
            e.preventDefault();
            const docId = document.getElementById('input-doc-id').value.trim();
            if (!docId) {
                alert("Introduce un identificador válido");
                return;
            }

            const datosObra = {
                obraNum: document.getElementById('input-titulo').value,
                tecnica: document.getElementById('input-tecnica').value,
                medidas: document.getElementById('input-medidas').value,
                precio: document.getElementById('input-precio').value,
                estado: document.getElementById('input-estado').value,
                foto: document.getElementById('input-imagen').value
            };

            db.collection("obras").doc(docId).set(datosObra, { merge: true })
                .then(() => {
                    alert(`¡${docId} guardada con éxito en Firebase!`);
                    document.getElementById('form-cuadro').reset();
                    document.getElementById('edit-id').value = '';
                    document.getElementById('input-doc-id').disabled = false;
                    document.getElementById('btn-guardar-texto').innerText = "GUARDAR EN FIREBASE";
                })
                .catch(error => {
                    alert("Error al guardar: " + error.message);
                });
        }

        // SUBIDA AUTOMÁTICA DE LAS 88 OBRAS CON SUS PRECIOS ACTUALIZADOS
        async function inicializar88Obras() {
            if (!confirm("¿Deseas subir o actualizar las 88 obras con los precios actualizados en Firebase?")) return;

            const obras3000 = [19, 86];
            const obras2000 = [1, 4, 5, 18, 21, 23, 26, 28, 34, 84, 85];
            const obraNoDisponible = 35;

            const batch = db.batch();

            for (let i = 1; i <= 88; i++) {
                const docRef = db.collection("obras").doc(`obra_${i}`);

                let precio = "1000€";
                let estado = "DISPONIBLE";

                if (obras3000.includes(i)) {
                    precio = "3000€";
                } else if (obras2000.includes(i)) {
                    precio = "2000€";
                } else if (i === obraNoDisponible) {
                    precio = "-";
                    estado = "NO DISPONIBLE";
                }

                batch.set(docRef, {
                    obraNum: `Obra #${i}`,
                    tecnica: "Técnica mixta sobre tela",
                    medidas: "100 x 70 cm",
                    precio: precio,
                    estado: estado,
                    foto: `foto${i}.jpeg`
                }, { merge: true });
            }

            try {
                await batch.commit();
                alert("✅ ¡Las 88 obras se han subido con éxito a Firebase con los precios actualizados!");
            } catch (err) {
                alert("Error al guardar en Firebase: " + err.message);
            }
        }
    </script>
</body>

</html>
